services:
    auth:
        build:
            context: .
            dockerfile: dockerfile
            args:
                VITE_AUTH_BRIDGE_ORIGINS: ${VITE_AUTH_BRIDGE_ORIGINS:-}
                NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
                GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
                RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.21}
                VITE_AUTH_RETURN_ORIGINS: ${VITE_AUTH_RETURN_ORIGINS:-}
        container_name: auth-service
        env_file:
            - .env
        ports:
            - "8123:8888"
        environment:
            SERVER_PORT: "8888"
            DB_URL: /data/auth.sqlite
        cpus: "1.0"
        mem_limit: 256m
        stop_grace_period: 35s
        volumes:
            - auth_data:/data

volumes:
    auth_data:
