<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Auth</title>

    <style>
        @font-face {
            font-family: 'Faustina';
            src: url('/fonts/Faustina.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            gap: 0;
            user-select: none;
            outline: none;
            font-family: "Faustina", sans-serif;
            box-sizing: border-box;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;

            input,
            textarea,
            button {
                border: none;
                background: none;
            }

            textarea {
                field-sizing: content;
            }

            scrollbar-width: none;
        }

        :root {
            line-height: 1.5;
            font-weight: 500;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            --bg: #0a0a0a;
            --surface: #171717;
            --border: #2a2a2a;
            --text: #ededed;
            --muted: #888888;
            --accent: #ededed;
            --accent-hover: #ffffff;
            --error: #f19a9a;
            --success: #9bd5a8;
        }

        html {
            background-color: var(--bg);
            color: var(--text);
        }

        html,
        body {
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            background-color: var(--bg);
        }

        #root {
            min-height: 100dvh;
            background-color: var(--bg);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
