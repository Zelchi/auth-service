<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Service</title>

    <style>
        @font-face {
            font-family: 'Faustina';
            src: url('/fonts/Faustina.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            gap: 0;
            user-select: none;
            outline: none;
            font-family: "Faustina", sans-serif;
            box-sizing: border-box;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;

            input,
            textarea,
            button {
                border: none;
                background: none;
            }

            textarea {
                field-sizing: content;
            }

            scrollbar-width: none;
        }

        :root {
            line-height: 1.5;
            font-weight: 500;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            --bg: #F2F4F8;
            --surface: #FFFFFF;
            --border: #DDE1EA;
            --text: rgba(0, 0, 0, 0.85);
            --muted: rgba(0, 0, 0, 0.40);
            --accent: #4A5E85;
            --accent-hover: #3A4E75;
            --error: #C0392B;
            --success: #1A8A4A;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #06080E;
                --surface: #0D1117;
                --border: #1C2333;
                --text: rgba(255, 255, 255, 0.90);
                --muted: rgba(255, 255, 255, 0.40);
                --accent: #8695B4;
                --accent-hover: #A0AFCB;
                --error: #C0392B;
                --success: #2ECC71;
            }
        }

        html {
            background-color: var(--bg);
            color: var(--text);
        }

        html,
        body {
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
